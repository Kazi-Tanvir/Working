services:
  mysql:
    image: mysql:8.0
    container_name: shindb-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shindb}
      MYSQL_USER: ${MYSQL_USER:-shindb_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shindb_secure_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shindb_root_secure_password}
    volumes:
      - shindb_mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-shindb_root_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shindb-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shindb-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-shindb_user}:${MYSQL_PASSWORD:-shindb_secure_password}@mysql:3306/${MYSQL_DATABASE:-shindb}"
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shindb-net

volumes:
  shindb_mysql_data:
    name: shindb_mysql_data

networks:
  shindb-net:
    name: shindb-net
    driver: bridge
